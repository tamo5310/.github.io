<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ずんちゃんメセカ作成フォーム</title>
  <style>
    :root{--pink:#f7a7cd;--deep:#e46aa5;--ink:#555;--bg:#fff5fb;--line:#ffd1e8}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    header{padding:20px 14px;text-align:center;background:#ffe2f1;border-bottom:3px solid var(--line)}
    h1{font-size:22px;margin:0 0 6px;color:var(--deep)}.lead{margin:0;font-size:14px}
    main{max-width:980px;margin:auto;padding:16px}.panel{background:white;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 16px #e9b8d840}
    label{font-weight:700;display:block;margin:10px 0 6px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff}textarea{min-height:92px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:999px;padding:11px 16px;background:var(--pink);color:white;font-weight:700;box-shadow:0 3px 0 #dc78ad;cursor:pointer}button.secondary{background:#aaa;box-shadow:0 3px 0 #888}button.danger{background:#f08a8a;box-shadow:0 3px 0 #cf6666}button:disabled{opacity:.55;cursor:not-allowed}
    .canvasWrap{position:relative;width:100%;overflow:auto;text-align:center;touch-action:none;overscroll-behavior:contain}canvas{max-width:100%;height:auto;border-radius:12px;background:white;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 2px 12px #0001}.small{font-size:12px;color:#777}.hidden{display:none!important}
    .rangeLine{display:flex;align-items:center;gap:10px}.rangeLine input[type="range"]{padding:0}.rangeValue{min-width:48px;text-align:right;font-size:12px;color:#777}
    .checks{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:10px}.checks label{display:flex;align-items:center;gap:6px;margin:0;font-weight:700}.checks input{width:auto}
    .counter{text-align:right;font-size:12px;color:#777;margin-top:4px}.hint{background:#fff8fc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:12px}.thanks{text-align:center;padding:34px 16px}.thanks h2{color:var(--deep);font-size:24px}.status{margin-top:10px;font-weight:700;color:var(--deep)}
    @media(max-width:700px){.row{grid-template-columns:1fr}h1{font-size:19px}}
  </style>
</head>
<body>
<header>
  <h1>ずんちゃんメセカ作成フォーム</h1>
  <p class="lead">メッセージを書いて、送信してください。</p>
</header>
<main>
  <div id="formArea">
    <section class="panel">
      <label>From（お名前）</label>
      <input id="from" maxlength="24" placeholder="例：いちごひめ" />
      <label>メッセージ</label>
      <textarea id="message" maxlength="240" placeholder="例：ずんちゃん、お誕生日おめでとう！&#10;素敵な一年になりますように。"></textarea>
      <div id="msgCounter" class="counter">0 / 240文字</div>
      <div class="row">
        <div><label>本文サイズ</label><select id="fontSize"><option value="26">小さめ</option><option value="32" selected>ふつう</option><option value="38">大きめ</option><option value="44">特大</option></select></div>
        <div><label>本文の色</label><select id="msgColor"></select></div>
      </div>
      <div class="row">
        <div><label>名前サイズ</label><select id="nameSize"><option value="24">小さめ</option><option value="28" selected>ふつう</option><option value="32">大きめ</option><option value="36">特大</option></select></div>
        <div><label>名前の色</label><select id="nameColor"></select></div>
      </div>
      <div class="row">
        <div><label>本文の左右位置</label><div class="rangeLine"><input id="msgX" type="range" min="120" max="430" value="245"><span id="msgXv" class="rangeValue"></span></div></div>
        <div><label>本文の上下位置</label><div class="rangeLine"><input id="msgY" type="range" min="90" max="260" value="167"><span id="msgYv" class="rangeValue"></span></div></div>
      </div>
      <div class="row">
        <div><label>名前の左右位置</label><div class="rangeLine"><input id="nameX" type="range" min="380" max="560" value="444"><span id="nameXv" class="rangeValue"></span></div></div>
        <div><label>名前の上下位置</label><div class="rangeLine"><input id="nameY" type="range" min="455" max="520" value="467"><span id="nameYv" class="rangeValue"></span></div></div>
      </div>
      <div class="checks">
        <label><input id="boldText" type="checkbox" checked> 太字</label>
        <label><input id="shadowText" type="checkbox"> 影つき</label>
      </div>
      <div class="buttons">
        <button id="sendBtn">送信する</button>
        <button id="undoHandBtn" class="secondary" disabled>↩ 元に戻す</button>
        <button id="clearHandBtn" class="danger">手書きを消す</button>
        <button id="resetBtn" class="secondary">位置を戻す</button>
      </div>
      <div id="status" class="status"></div>
      <div class="hint small">入力内容はすぐカードに反映されます。メッセージ欄で改行した場合、そのままカード上でも改行されます。スマホでは画像の上を指でなぞると手書きできます。</div>
    </section>
    <section class="panel"><div class="canvasWrap"><canvas id="card" width="986" height="576"></canvas></div></section>
  </div>
  <section id="thanksArea" class="panel thanks hidden">
    <h2>🎂 メッセージを受け付けました 🎂</h2>
    <p>ご入力いただいたメッセージは<br>お誕生日アルバムとして本人へお届けします。</p>
    <p>ご参加ありがとうございました🍓</p>
    <p class="small">この画面は閉じていただいて大丈夫です。</p>
  </section>
</main>
<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

const canvas=document.getElementById('card'); const ctx=canvas.getContext('2d');
const base=new Image(); base.src='assets/meseca-template.jpeg';
const hand=document.createElement('canvas'); hand.width=986; hand.height=576; const hctx=hand.getContext('2d');
let drawing=false,last=null;
let handHistory=[];
function updateUndoButton(){const btn=document.getElementById('undoHandBtn'); if(btn) btn.disabled = handHistory.length === 0;}
function saveHandHistory(){handHistory.push(hctx.getImageData(0,0,hand.width,hand.height)); if(handHistory.length>30) handHistory.shift(); updateUndoButton();}
const defaults={msgX:245,msgY:167,nameX:444,nameY:467};
const colors=[['#e46aa5','ピンク'],['#e84b5f','赤'],['#f28b38','オレンジ'],['#f0c84b','黄色'],['#55b86f','緑'],['#4aa3c7','水色'],['#4f73d9','青'],['#8a63c7','紫']];
function fillColorSelect(id, selected){const sel=document.getElementById(id);sel.innerHTML=colors.map(([v,n])=>`<option value="${v}" ${v===selected?'selected':''}>${n}</option>`).join('');}
fillColorSelect('msgColor','#e46aa5'); fillColorSelect('nameColor','#4aa3c7');
function updateRangeLabels(){['msgX','msgY','nameX','nameY'].forEach(id=>{document.getElementById(id+'v').textContent=document.getElementById(id).value+' px';});}
function updateCounter(){const len=document.getElementById('message').value.length;document.getElementById('msgCounter').textContent=`${len} / 240文字`;}
function wrapSingleLine(text,x,y,maxWidth,lineHeight,maxLines,lines){const chars=[...text]; let line='';for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch;if(lines.length>=maxLines)return;}else line=test;}lines.push(line);}
function drawStyledLine(text,x,y){const shadow=document.getElementById('shadowText').checked;if(shadow){ctx.shadowColor='rgba(0,0,0,.22)';ctx.shadowBlur=3;ctx.shadowOffsetX=2;ctx.shadowOffsetY=2;}else{ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;}ctx.fillText(text,x,y);ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;}
function drawMessage(text,x,y,maxWidth,lineHeight,maxLines){const rawLines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');const lines=[];for(const raw of rawLines){if(lines.length>=maxLines)break;if(raw===''){lines.push('');continue;}wrapSingleLine(raw,x,y,maxWidth,lineHeight,maxLines,lines);}lines.slice(0,maxLines).forEach((l,i)=>drawStyledLine(l,x,y+i*lineHeight));}
function render(){updateRangeLabels();updateCounter();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(base,0,0,986,576);const name=document.getElementById('from').value.trim();const msg=document.getElementById('message').value;const size=+document.getElementById('fontSize').value;const nameSize=+document.getElementById('nameSize').value;const msgColor=document.getElementById('msgColor').value;const nameColor=document.getElementById('nameColor').value;const mx=+document.getElementById('msgX').value; const my=+document.getElementById('msgY').value;const nx=+document.getElementById('nameX').value; const ny=+document.getElementById('nameY').value;const weight=document.getElementById('boldText').checked?'700':'500';ctx.textBaseline='top';ctx.fillStyle=msgColor;ctx.font=`${weight} ${size}px "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif`;drawMessage(msg,mx,my,555,size+14,7);ctx.fillStyle=nameColor;ctx.font=`${weight} ${nameSize}px "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif`;drawStyledLine(name,nx,ny);ctx.drawImage(hand,0,0);}
base.onload=render;
['from','message','fontSize','nameSize','msgColor','nameColor','msgX','msgY','nameX','nameY','boldText','shadowText'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.getElementById('resetBtn').onclick=()=>{Object.entries(defaults).forEach(([id,val])=>document.getElementById(id).value=val);render();};
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  saveHandHistory();
  drawing=true;
  last=pos(e);
  canvas.setPointerCapture(e.pointerId);
},{passive:false});
canvas.addEventListener('pointermove',e=>{
  if(!drawing)return;
  e.preventDefault();
  const p=pos(e);
  hctx.strokeStyle=document.getElementById('msgColor').value;
  hctx.lineWidth=5;
  hctx.lineCap='round';
  hctx.lineJoin='round';
  hctx.beginPath();
  hctx.moveTo(last.x,last.y);
  hctx.lineTo(p.x,p.y);
  hctx.stroke();
  last=p;
  render();
},{passive:false});
canvas.addEventListener('pointerup',e=>{e.preventDefault();drawing=false;},{passive:false});
canvas.addEventListener('pointercancel',e=>{e.preventDefault();drawing=false;},{passive:false});
document.getElementById('undoHandBtn').onclick=()=>{
  const prev=handHistory.pop();
  if(!prev)return;
  hctx.putImageData(prev,0,0);
  updateUndoButton();
  render();
};
document.getElementById('clearHandBtn').onclick=()=>{saveHandHistory();hctx.clearRect(0,0,hand.width,hand.height);render()};
updateUndoButton();
function isFirebaseReady(){const c=window.MESECA_FIREBASE_CONFIG||{};return !!(c.apiKey&&c.projectId);}
let app,db;if(isFirebaseReady()){app=initializeApp(window.MESECA_FIREBASE_CONFIG);db=getFirestore(app);}
document.getElementById('sendBtn').onclick=async()=>{
  const from=document.getElementById('from').value.trim(); const message=document.getElementById('message').value.trim();
  if(!from){alert('お名前を入力してください。');return;} if(!message){alert('メッセージを入力してください。');return;}
  if(!isFirebaseReady()){alert('Firebase設定がまだ入っていません。firebase-config.js に設定を貼ってから送信できます。');return;}
  const btn=document.getElementById('sendBtn'); const status=document.getElementById('status'); btn.disabled=true; status.textContent='送信中です…';
  try{
    render();
    const handDataUrl = hand.toDataURL('image/png');
    await addDoc(collection(db,'meseca_cards'),{
      from,
      message,
      handDataUrl,
      style:{
        fontSize:+document.getElementById('fontSize').value,
        nameSize:+document.getElementById('nameSize').value,
        msgColor:document.getElementById('msgColor').value,
        nameColor:document.getElementById('nameColor').value,
        msgX:+document.getElementById('msgX').value,
        msgY:+document.getElementById('msgY').value,
        nameX:+document.getElementById('nameX').value,
        nameY:+document.getElementById('nameY').value,
        boldText:document.getElementById('boldText').checked,
        shadowText:document.getElementById('shadowText').checked
      },
      createdAt:serverTimestamp(),
      checked:false
    });
    document.getElementById('formArea').classList.add('hidden'); document.getElementById('thanksArea').classList.remove('hidden'); window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){console.error(err); alert('送信に失敗しました。少し時間をおいてもう一度お試しください。'); btn.disabled=false; status.textContent='';}
};
</script>
</body>
</html>
