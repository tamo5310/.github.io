<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メセカ管理画面</title>
  <style>
    :root{--pink:#f7a7cd;--deep:#e46aa5;--ink:#555;--bg:#fff5fb;--line:#ffd1e8;--danger:#f08a8a}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    header{padding:18px 14px;text-align:center;background:#ffe2f1;border-bottom:3px solid var(--line)}
    h1{font-size:22px;margin:0;color:var(--deep)}
    main{max-width:1120px;margin:auto;padding:16px}
    .panel{background:white;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 16px #e9b8d840}
    input,button,select{font:inherit}input,select{box-sizing:border-box;border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff}
    button{border:0;border-radius:999px;padding:10px 14px;background:var(--pink);color:white;font-weight:700;box-shadow:0 3px 0 #dc78ad;cursor:pointer}
    button.secondary{background:#aaa;box-shadow:0 3px 0 #888}
    button.danger{background:var(--danger);box-shadow:0 3px 0 #cf6666}
    button:disabled{opacity:.55;cursor:not-allowed}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
    .card{background:white;border:1px solid var(--line);border-radius:16px;padding:10px}
    canvas{width:100%;height:auto;border-radius:12px;box-shadow:0 2px 8px #0001}
    .meta{font-size:13px;margin:8px 0;color:#666;line-height:1.7}.hidden{display:none!important}
    .small{font-size:12px;color:#777}.status{font-weight:700;color:var(--deep)}
    .cardButtons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    @media print{header,.panel:first-child,.cardButtons,.meta{display:none!important}main{max-width:none;padding:0}.grid{display:block}.card{page-break-inside:avoid;border:0;margin:0 0 10px;padding:0}canvas{box-shadow:none;border-radius:0;width:100%}}
  </style>
</head>
<body>
<header><h1>メセカ管理画面</h1></header>
<main>
  <section id="login" class="panel">
    <p>管理パスワードを入力してください。</p>
    <input id="pass" type="password" placeholder="管理パスワード">
    <button id="loginBtn">開く</button>
    <p class="small">パスワードは firebase-config.js の MESECA_ADMIN_PASSWORD で設定します。</p>
  </section>

  <section id="adminArea" class="hidden">
    <section class="panel">
      <div class="toolbar">
        <button id="loadBtn">一覧を更新</button>
        <button id="printBtn" class="secondary">印刷する</button>
        <label class="small">並び順
          <select id="sortOrder">
            <option value="desc">新しい順</option>
            <option value="asc">古い順</option>
          </select>
        </label>
        <span id="status" class="status"></span>
      </div>
      <p class="small">画像はStorageではなく、Firestoreに保存された内容からこの管理画面で再生成します。</p>
    </section>
    <section id="list" class="grid"></section>
  </section>
</main>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

const CONFIG=window.MESECA_FIREBASE_CONFIG||{};
const PASSWORD=window.MESECA_ADMIN_PASSWORD||'';
let app, db;
const baseImg=new Image();
baseImg.src='assets/meseca-template.jpeg';

function isFirebaseReady(){return !!(CONFIG.apiKey&&CONFIG.projectId);}
function initFirebase(){ if(!isFirebaseReady()) throw new Error('Firebase設定がありません'); app=initializeApp(CONFIG); db=getFirestore(app); }

function formatDate(value){
  if(!value) return '日時なし';
  const d = typeof value.toDate === 'function' ? value.toDate() : new Date(value);
  if(Number.isNaN(d.getTime())) return '日時なし';
  return d.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function drawCard(canvas, data){
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,986,576);
  ctx.drawImage(baseImg,0,0,986,576);
  const style=data.style||{};
  const weight=style.boldText?'700':'500';
  function drawStyledLine(text,x,y){
    if(style.shadowText){ctx.shadowColor='rgba(0,0,0,.22)';ctx.shadowBlur=3;ctx.shadowOffsetX=2;ctx.shadowOffsetY=2;}
    else{ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;}
    ctx.fillText(text||'',x,y);
    ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  }
  function wrapSingleLine(text,maxWidth,maxLines,lines){
    const chars=[...(text||'')]; let line='';
    for(const ch of chars){
      const test=line+ch;
      if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch;if(lines.length>=maxLines)return;}
      else line=test;
    }
    lines.push(line);
  }
  function drawMessage(text,x,y,maxWidth,lineHeight,maxLines){
    const rawLines=(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
    const lines=[];
    for(const raw of rawLines){
      if(lines.length>=maxLines)break;
      if(raw===''){lines.push('');continue;}
      wrapSingleLine(raw,maxWidth,maxLines,lines);
    }
    lines.slice(0,maxLines).forEach((l,i)=>drawStyledLine(l,x,y+i*lineHeight));
  }
  ctx.textBaseline='top';
  const fontSize=style.fontSize||32;
  ctx.fillStyle=style.msgColor||'#e46aa5';
  ctx.font=`${weight} ${fontSize}px "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif`;
  drawMessage(data.message||'',style.msgX||245,style.msgY||167,555,fontSize+14,7);
  ctx.fillStyle=style.nameColor||'#4aa3c7';
  ctx.font=`${weight} ${style.nameSize||28}px "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif`;
  drawStyledLine(data.from||'',style.nameX||444,style.nameY||467);
  if(data.handDataUrl){
    const hand=new Image();
    hand.onload=()=>ctx.drawImage(hand,0,0);
    hand.src=data.handDataUrl;
  }
}

function downloadCanvas(canvas, name){
  const a=document.createElement('a');
  const safe=(name||'meseca').replace(/[\\/:*?"<>|]/g,'_');
  a.download=`${safe}_meseca.png`;
  a.href=canvas.toDataURL('image/png');
  a.click();
}

async function deleteCard(id, from){
  if(!confirm(`「${from||id}」の投稿を削除しますか？\nこの操作は元に戻せません。`)) return;
  try{
    await deleteDoc(doc(db,'meseca_cards',id));
    await loadCards();
  }catch(err){
    console.error(err);
    alert('削除に失敗しました。Firestoreルールを確認してください。');
  }
}
