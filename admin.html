<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>メセカ管理画面</title>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff5fb;color:#555}header{text-align:center;background:#ffe2f1;padding:18px;border-bottom:3px solid #ffd1e8}h1{font-size:22px;color:#e46aa5}main{max-width:1100px;margin:auto;padding:16px}.panel{background:#fff;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 16px #e9b8d840}input,button{font:inherit;border-radius:12px;padding:10px}input{border:2px solid #ffd1e8}button{border:0;background:#f7a7cd;color:white;font-weight:700;box-shadow:0 3px 0 #dc78ad;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.card{border:1px solid #ffd1e8;border-radius:14px;padding:10px;background:#fff}.card img{width:100%;border-radius:10px}.meta{font-size:13px}.hidden{display:none!important}.small{font-size:12px;color:#777}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}@media print{header,.noPrint{display:none}.grid{display:block}.card{break-inside:avoid;margin:0 0 10px;border:0}.meta,.buttons{display:none}.card img{width:100%}}</style>
</head><body><header><h1>メセカ管理画面</h1></header><main>
<section id="login" class="panel noPrint"><p>管理パスワードを入力してください。</p><input id="pw" type="password" placeholder="管理パスワード"><button id="loginBtn">開く</button><p class="small">firebase-config.js の MESECA_ADMIN_PASSWORD を使います。</p></section>
<section id="admin" class="panel hidden"><div class="noPrint"><button id="reloadBtn">再読み込み</button> <button id="printBtn">印刷</button><p id="count"></p></div><div id="list" class="grid"></div></section>
</main><script src="firebase-config.js"></script><script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
function isFirebaseReady(){const c=window.MESECA_FIREBASE_CONFIG||{};return !!(c.apiKey&&c.projectId&&c.storageBucket);}let db;
function setup(){if(!isFirebaseReady()){alert('Firebase設定がまだ入っていません。');return false;}const app=initializeApp(window.MESECA_FIREBASE_CONFIG);db=getFirestore(app);return true;}
async function load(){const list=document.getElementById('list');list.innerHTML='読み込み中…';const snap=await getDocs(query(collection(db,'meseca_cards'),orderBy('createdAt','desc')));const items=[];snap.forEach(d=>items.push({id:d.id,...d.data()}));document.getElementById('count').textContent=`${items.length}件`;list.innerHTML=items.map((x,i)=>`<div class="card"><img src="${x.imageUrl}" alt="${x.from||''}"><div class="meta"><b>${x.from||'(名前なし)'}</b><br>${x.createdAt?.toDate?x.createdAt.toDate().toLocaleString('ja-JP'):''}</div><div class="buttons noPrint"><a href="${x.imageUrl}" download="meseca_${i+1}_${(x.from||'noname').replace(/[\\/:*?&quot;<>|]/g,'_')}.png"><button>ダウンロード</button></a></div></div>`).join('')||'まだ投稿はありません。';}
document.getElementById('loginBtn').onclick=async()=>{if(document.getElementById('pw').value!==window.MESECA_ADMIN_PASSWORD){alert('パスワードが違います。');return;}if(!setup())return;document.getElementById('login').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');await load();};
document.getElementById('reloadBtn').onclick=load;document.getElementById('printBtn').onclick=()=>window.print();
</script></body></html>
